<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta regresiva de cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{--wine:#C8102E;--wine-l:#E03A4E;--purple:#1E3A8A;--purple-l:#2B63D9;--blue:#1E3A8A;--blue-l:#2B63D9;--paper:#FFFDFB;--ink:#3B1526;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Cormorant Garamond',serif;color:var(--ink);min-height:100%;
background:linear-gradient(160deg,#1E3A8A 0%,#2B63D9 38%,#f4f6ff 50%,#E03A4E 62%,#B3122D 100%);
transition:background 1s ease;
display:flex;justify-content:center;padding:1.6rem 1rem 3rem;}
body.day-finale{background:linear-gradient(160deg,#1E3A8A 0%,#2B63D9 38%,#f4f6ff 50%,#E03A4E 62%,#B3122D 100%);}
.wrap{width:100%;max-width:560px;}
h1.main{font-family:'Parisienne',cursive;color:#fff;text-align:center;font-size:2.3rem;margin:.2rem 0 .1rem;text-shadow:0 3px 10px rgba(0,0,0,.25);}
.sub{color:#f3e3ea;text-align:center;margin:0 0 1.2rem;font-size:1.05rem;}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-bottom:1.3rem;}
.lvl{aspect-ratio:1;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
font-size:1.15rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;transition:transform .15s;}
.lvl.unlocked{background:var(--paper);color:var(--wine);box-shadow:0 6px 14px rgba(0,0,0,.25);}
.lvl.current{outline:3px solid #fff;}
.lvl.locked{cursor:default;opacity:.55;}
.lvl:active.unlocked{transform:scale(.9);}
.card{background:var(--paper);border-radius:16px;padding:1.8rem 1.5rem;box-shadow:0 20px 50px rgba(20,3,15,.4);min-height:260px;}
.card h2{font-family:'Parisienne',cursive;color:var(--wine);font-size:1.9rem;margin:0 0 .5rem;text-align:center;}
.card p{font-size:1.15rem;line-height:1.55;margin:0 0 .9rem;}
.pre{background:var(--paper);border-radius:16px;padding:2.2rem 1.5rem;text-align:center;box-shadow:0 20px 50px rgba(20,3,15,.4);}
.pre .big{font-size:3rem;}
button.act{font-family:inherit;font-size:1.02rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--wine),var(--purple));
border:0;border-radius:999px;padding:.6rem 1.3rem;box-shadow:0 8px 18px rgba(75,36,114,.35);margin:.3rem .2rem;}
button.act:active{transform:scale(.95);}
.quiz-opt{display:block;width:100%;box-sizing:border-box;text-align:left;margin:.4rem 0;padding:.6rem .8rem;border-radius:10px;border:1.5px solid #e4cdd4;background:#fff;
font-family:inherit;font-size:1rem;line-height:1.3;cursor:pointer;white-space:normal;overflow-wrap:break-word;}
@media (max-width:380px){
  .card{padding:1.4rem 1rem;}
  .quiz-opt{font-size:.95rem;padding:.55rem .7rem;}
  .card h2{font-size:1.6rem;}
  .card p{font-size:1.05rem;}
}
.quiz-opt.ok{background:#e6f6ea;border-color:#3fa85a;}
.quiz-opt.bad{background:#fbe8ea;border-color:var(--wine);}
.feedback{margin-top:.6rem;font-size:1.05rem;color:var(--purple);min-height:1.4em;}
.hearts-pop{position:relative;height:210px;background:linear-gradient(160deg,#fff,#fbeef1);border-radius:12px;overflow:hidden;margin-bottom:.8rem;}
.hp{position:absolute;font-size:1.6rem;cursor:pointer;user-select:none;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{50%{transform:scale(1.15);}}
.score{text-align:center;font-size:1.05rem;color:var(--purple);}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.6rem;}
.mem-card{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--wine),var(--purple));display:flex;align-items:center;justify-content:center;
font-size:1.6rem;cursor:pointer;color:transparent;transition:transform .25s;}
.mem-card.flip{color:#fff;background:#fff;color:var(--wine);transform:none;}
.mem-card.matched{background:#e6f6ea;color:#2f8a4a;}
.wheel-box{text-align:center;}
.wheel{width:150px;height:150px;border-radius:50%;margin:0 auto 1rem;background:conic-gradient(var(--wine) 0 25%,var(--purple) 0 50%,var(--wine-l) 0 75%,var(--purple-l) 0 100%);
transition:transform 2.2s cubic-bezier(.2,.8,.2,1);position:relative;}
.wheel::after{content:"▲";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#fff;font-size:1.2rem;}
.boxes{display:flex;justify-content:center;gap:.8rem;margin-bottom:.8rem;}
.box{font-size:2.6rem;cursor:pointer;transition:transform .15s;}
.box:active{transform:scale(.85);}
textarea.wish{width:100%;min-height:90px;border-radius:10px;border:1.5px solid #e4cdd4;padding:.6rem;font-family:inherit;font-size:1.05rem;resize:vertical;}
.gallery{text-align:center;}
.gallery img{width:100%;max-width:320px;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.3);margin-bottom:.7rem;}
.gal-cap{font-style:italic;color:var(--purple);margin-bottom:.9rem;}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
.cf{position:absolute;top:-5%;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg);opacity:.9;}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="main">Para ti, cada día ♥</h1>
  <p class="sub" id="subtitle"></p>
  <div id="app"></div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const START = new Date(2026,9,6);   // 6 de octubre 2026
const TOTAL_DAYS = 10;               // hasta el 15 de octubre (su cumpleaños)

function today0(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function diffDays(a,b){return Math.round((b-a)/86400000);}
const dayIndex = diffDays(START, today0()) + 1;
function currentUnlocked(){ return Math.min(Math.max(dayIndex,0), TOTAL_DAYS); }
let unlocked = currentUnlocked();
let viewDay = unlocked>0 ? unlocked : 1;


const DATA = [
 {t:"Día 1 · ¡Empezamos!", type:"message", music:"a",
  msg:"Hoy comienza una cuenta regresiva especial. Cada día hasta tu cumpleaños te voy a dejar un pedacito de lo mucho que te quiero, y algún jueguito para sacarte una sonrisa. ¡Vamos a disfrutarlo juntos! Espero que te guste tu regalo. A partir de hoy y en adelante puedes regresar aquí cada día para descubrir un mensaje nuevo."},
 {t:"Día 2 · Trivia random", type:"quiz",
  qs:[
    {q:"¿Cuál es el símbolo universal del amor?",o:["El corazón ♥","El triángulo","El cuadrado"],c:0},
    {q:"Según la Biblia, ¿qué es lo que \"todo lo puede\"?",o:["El dinero","El amor","La suerte"],c:1},
    {q:"¿Qué se dice que hay que regar todos los días para que crezca?",o:["El amor","El cemento","El rencor"],c:0},
    {q:"¿Qué representa un detalle pequeño hecho con cariño?",o:["Nada importante","Una obligación","Mucho amor"],c:2}
  ]},
 {t:"Día 3 · Revienta corazones", type:"click", need:12,
  msg:"Toca 12 corazones antes de que se escapen 💓"},
 {t:"Día 4 · Memorama del cariño", type:"memory",
  icons:["💖","🎂","🎉","⭐","🎈","😊"]},
 {t:"Día 5 · Ruleta de piropos", type:"wheel", music:"b",
  msgs:["Eres mi persona favorita, sin discusión.","Tienes la sonrisa que más me gusta en el mundo.",
    "Contigo hasta los días grises se ven bonitos.","Eres la mejor parte de mi día, todos los días.",
    "Gracias por quererme tan bonito.","Cada día te quiero un poquito más.",
    "Eres mi lugar favorito.","Dios te hizo justo a mi medida."]},
 {t:"Día 6 · Con cariño para ti", type:"message",
  msg:"Que tus años se multipliquen en bendiciones. \"El Señor te bendiga y te guarde\" (Números 6:24). Gracias por todo lo que eres y por dejarme acompañarte en este camino. Me encanta lo auténtico que eres y la alegría que le das a mis días. Ojalá nunca pierdas esa luz tan tuya, porque contigo todo se siente más bonito.",
  music:"d"},
 {t:"Día 7 · Elige una cajita", type:"boxes",
  msgs:["Hoy quiero que sepas que me haces muy feliz.","Eres un regalo en mi vida, literal.",
    "Gracias por tu paciencia conmigo.","Admiro muchísimo las ganas que le pones a todo."]},
 {t:"Día 8 · Tu deseo de cumpleaños", type:"wish"},
 {t:"Día 9 · Ya casi...", type:"message", music:"e",
  msg:"¡Ya casi es hora! Prepárate y agarra emoción, porque mañana es tu gran día. Espero que este cumpleaños sea tan especial como tú lo eres para mí. ✨"},
 {t:"¡Feliz cumpleaños! 🎉", type:"finale", music:"c"}
];

const app = document.getElementById('app');
const subtitle = document.getElementById('subtitle');

function beep(freqs,dur){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    let t = ctx.currentTime;
    freqs.forEach(f=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.28,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.03);
      t+=dur*0.82;
    });
  }catch(e){}
}
const MELODIES = {
  a:[392,440,494,523,587,659],
  b:[440,523,440,523,587,659,587,523,659,784],
  c:[392,392,440,392,523,494, 392,392,440,392,587,523, 392,392,784,659,523,494,440, 698,698,659,523,587,523]
};
// ---- Piano (sintetizado, sin archivos externos) ----
let AC=null;
function getCtx(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function mf(m){ return 440*Math.pow(2,(m-69)/12); }
function pianoNote(c,t,midi,dur,vol){
  const f=mf(midi);
  const out=c.createGain();
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(vol,t+0.012);
  out.gain.exponentialRampToValueAtTime(vol*0.35,t+0.35);
  out.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.9);
  out.connect(c.destination);
  [[1,'triangle',1],[2,'sine',0.35],[3,'sine',0.15],[4,'sine',0.06]].forEach(p=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type=p[1]; o.frequency.value=f*p[0]; g.gain.value=p[2];
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t+dur+1);
  });
}
// notas: [midi, pulsos]; "chord" = notas a la vez
const PIANO={
  a:{beat:0.5, mel:[[60,1],[64,1],[67,1],[72,1.5],[71,0.5],[69,1],[67,1],[64,1],[67,1],[72,3]], bass:[[48,4],[43,4],[45,4],[48,4]]},
  b:{beat:0.5, mel:[[67,1],[72,1],[76,1],[74,1.5],[72,0.5],[69,1],[71,1],[67,1],[69,1],[72,3]], bass:[[48,4],[53,4],[43,4],[48,4]]},
  d:{beat:0.55,mel:[[64,1],[67,1],[71,1],[69,1],[67,1],[64,1],[66,1],[62,1],[64,3]], bass:[[52,4],[50,4],[52,4]]},
  e:{beat:0.32,mel:[[60,1],[62,1],[64,1],[65,1],[67,1],[69,1],[71,1],[72,2],[67,0.5],[72,0.5],[76,0.5],[79,3]], bass:[[48,8],[43,4],[48,4]], chord:[48,60,64,67,72]},
  c:{beat:0.5, mel:[[67,0.75],[67,0.25],[69,1],[67,1],[72,1],[71,2],[67,0.75],[67,0.25],[69,1],[67,1],[74,1],[72,2],[67,0.75],[67,0.25],[79,1],[76,1],[72,1],[71,1],[69,1],[77,0.75],[77,0.25],[76,1],[72,1],[74,1],[72,3]], bass:[[48,6],[43,6],[48,6],[53,4],[48,6]]}
};
function playMusic(key){
  try{
    const c=getCtx(), m=PIANO[key]||PIANO.a, t0=c.currentTime+0.08;
    let t=t0;
    m.mel.forEach(n=>{ pianoNote(c,t,n[0],n[1]*m.beat,0.28); t+=n[1]*m.beat; });
    let tb=t0;
    m.bass.forEach(n=>{ pianoNote(c,tb,n[0],n[1]*m.beat,0.16); tb+=n[1]*m.beat; });
    if(m.chord){ m.chord.forEach(x=>pianoNote(c,t,x,2.5,0.18)); }
  }catch(e){}
}
function musicBtn(key){ return '<button class="act" onclick="playMusic(\''+key+'\')">'+'🎹'+' Musiquita</button>'; }

function renderLevels(){
  let html = '<div class="levels">';
  for(let i=1;i<=TOTAL_DAYS;i++){
    const u = i<=unlocked;
    const cur = i===viewDay;
    html += '<button class="lvl '+(u?'unlocked':'locked')+(cur?' current':'')+'" '
      + (u?('onclick="selectDay('+i+')"'):'disabled')
      + '>'+(u?i:'🔒')+'</button>';
  }
  html += '</div>';
  return html;
}

function selectDay(n){
  viewDay = n;
  render();
}



function render(){
  if(unlocked<=0){
    app.innerHTML = '<div class="pre"><div class="big">🎁</div>'
      +'<p>Tu sorpresa empieza el 6 de octubre.<br>Vuelve ese día ♥</p></div>'
      ;
    subtitle.textContent = '';
    return;
  }
  if(viewDay>=TOTAL_DAYS){
    subtitle.textContent = '¡Hoy es tu cumpleaños! 🎂';
  } else {
    const faltan = TOTAL_DAYS - viewDay + 1;
    subtitle.textContent = 'Faltan '+faltan+' día'+(faltan===1?'':'s')+(viewDay===unlocked?' · ¡nuevo!':'');
  }
  const d = DATA[viewDay-1];
  document.body.classList.toggle('day-finale', d.type==='finale');
  let inner = '<h2>'+d.t+'</h2>';

  if(d.type==='message'){
    inner += '<p>'+d.msg+'</p>';
    if(d.music) inner += musicBtn(d.music);
  }
  else if(d.type==='quiz'){
    inner += '<div id="quizArea"></div>';
  }
  else if(d.type==='click'){
    inner += '<p>'+d.msg+'</p><div class="hearts-pop" id="hp"></div><p class="score" id="hpScore">0 / '+d.need+'</p>';
  }
  else if(d.type==='memory'){
    inner += '<div class="mem-grid" id="memGrid"></div><p class="score" id="memMsg"></p>';
  }
  else if(d.type==='wheel'){
    inner += '<div class="wheel-box"><div class="wheel" id="wheel"></div>'
      +'<button class="act" onclick="spinWheel()">Girar ruleta</button>'
      +'<p class="feedback" id="wheelMsg"></p></div>';
    if(d.music) inner += musicBtn(d.music);
  }
  else if(d.type==='boxes'){
    inner += '<div class="boxes">'
      + d.msgs.map((m,i)=>'<span class="box" onclick="openBox('+i+')">🎁</span>').join('')
      + '</div><p class="feedback" id="boxMsg">Elige una cajita</p>';
  }
  else if(d.type==='wish'){
    inner += '<textarea class="wish" id="wishText" placeholder="Escribe aquí tu deseo de cumpleaños..."></textarea>'
      +'<div><button class="act" onclick="saveWish()">Guardar deseo</button></div>'
      +'<p class="feedback" id="wishMsg"></p>';
  }
  else if(d.type==='finale'){
    inner += '<div class="gallery" id="gallery"></div>'
      + '<p>¡Feliz cumpleaños, mi amor! Gracias por existir y por dejarme ser parte de tu vida. Que Dios te siga regalando muchos años más, llenos de salud y de cosas lindas por vivir. Te quiero muchísimo.</p>'
      + musicBtn(d.music);
  }

  app.innerHTML = renderLevels() + '<div class="card">'+inner+'</div>';

  if(d.type==='quiz') initQuiz(d);
  if(d.type==='click') initClick(d);
  if(d.type==='memory') initMemory(d);
  if(d.type==='finale') initFinale();
}

// ---- Quiz ----
function initQuiz(d){
  let idx=0, score=0;
  const area = document.getElementById('quizArea');
  function show(){
    if(idx>=d.qs.length){
      area.innerHTML = '<p class="feedback">¡Listo! '+score+'/'+d.qs.length+' 🎉<br>Nos vemos mañana para más ❤️</p>';
      return;
    }
    const q = d.qs[idx];
    area.innerHTML = '<p><b>'+q.q+'</b></p>'
      + q.o.map((o,i)=>'<button class="quiz-opt" onclick="answerQuiz('+i+')">'+o+'</button>').join('')
      + '<p class="feedback" id="qf"></p>';
    window.answerQuiz = function(i){
      const opts = area.querySelectorAll('.quiz-opt');
      opts.forEach(b=>b.onclick=null);
      if(i===q.c){opts[i].classList.add('ok');score++;document.getElementById('qf').textContent='¡Correcto!';}
      else{opts[i].classList.add('bad');opts[q.c].classList.add('ok');document.getElementById('qf').textContent='Casi, la correcta era otra 😅';}
      setTimeout(()=>{idx++;show();},900);
    };
  }
  show();
}

// ---- Click hearts ----
function initClick(d){
  const box = document.getElementById('hp');
  let popped=0;
  function spawn(){
    if(popped>=d.need) return;
    const h = document.createElement('span');
    h.className='hp'; h.textContent='💗';
    h.style.left = (5+Math.random()*85)+'%';
    h.style.top = (5+Math.random()*80)+'%';
    h.onclick = ()=>{
      popped++; h.remove();
      document.getElementById('hpScore').textContent = popped+' / '+d.need;
      if(popped>=d.need){
        document.getElementById('hpScore').textContent = '¡Lo lograste! Feliz día, mi amor 💞';
      } else { spawn(); }
    };
    box.appendChild(h);
  }
  spawn();
}

// ---- Memory ----
function initMemory(d){
  const icons = d.icons.concat(d.icons);
  for(let i=icons.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[icons[i],icons[j]]=[icons[j],icons[i]];}
  const grid = document.getElementById('memGrid');
  grid.innerHTML = icons.map((ic,i)=>'<div class="mem-card" data-i="'+i+'" data-ic="'+ic+'" onclick="flipCard(this)"></div>').join('');
  window._memOpen=[]; window._memMatched=0; window._memTotal=d.icons.length;
}
function flipCard(el){
  if(el.classList.contains('flip')||el.classList.contains('matched')) return;
  if(window._memOpen.length>=2) return;
  el.textContent = el.dataset.ic;
  el.classList.add('flip');
  window._memOpen.push(el);
  if(window._memOpen.length===2){
    const [a,b]=window._memOpen;
    if(a.dataset.ic===b.dataset.ic){
      a.classList.add('matched'); b.classList.add('matched');
      window._memOpen=[]; window._memMatched++;
      if(window._memMatched===window._memTotal) document.getElementById('memMsg').innerHTML='¡Completaste el memorama! 🎉<br>No olvides que te quiero 💖';
    } else {
      setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');a.textContent='';b.textContent='';window._memOpen=[];},700);
    }
  }
}

// ---- Wheel ----
function spinWheel(){
  const d = DATA[viewDay-1];
  const wheel = document.getElementById('wheel');
  const turns = 4 + Math.random()*2;
  const deg = turns*360;
  wheel.style.transform = 'rotate('+deg+'deg)';
  setTimeout(()=>{
    const m = d.msgs[Math.floor(Math.random()*d.msgs.length)];
    document.getElementById('wheelMsg').textContent = m;
  },2200);
}

// ---- Boxes ----
function openBox(i){
  const d = DATA[viewDay-1];
  document.getElementById('boxMsg').textContent = d.msgs[i];
}

// ---- Wish ----
function saveWish(){
  const v = document.getElementById('wishText').value.trim();
  document.getElementById('wishMsg').innerHTML = v ? '¡Deseo guardado! Ojalá se cumpla ✨<br>Que Dios te siga concediendo los deseos de tu corazón 🙏' : 'Escribe algo primero 🙂';
}

function initFinale(){
  let i=0;
  const g = document.getElementById('gallery');
  function show(){
    g.innerHTML = '<img src="'+PHOTOS[i].src+'"><p class="gal-cap">'+PHOTOS[i].cap+'</p>'
      +'<button class="act" onclick="nextPhoto()">Siguiente foto ➜</button>';
  }
  window.nextPhoto = ()=>{ i=(i+1)%PHOTOS.length; show(); };
  show();
  launchConfetti();
}
function launchConfetti(){
  const c = document.getElementById('confetti');
  const colors=['#8E1F3A','#B23A56','#1E3A8A','#2B63D9','#FFD166'];
  for(let k=0;k<40;k++){
    const s=document.createElement('span');
    s.className='cf';
    s.style.left=Math.random()*100+'%';
    s.style.width=s.style.height=(6+Math.random()*6)+'px';
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDuration=(3+Math.random()*2.5)+'s';
    s.style.animationDelay=(Math.random()*1.5)+'s';
    c.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
}

render();
